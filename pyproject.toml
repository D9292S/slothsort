[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slothsort"
version = "1.0.0"
description = "🦥 A local AI-powered file organizer that sorts and renames files using Ollama — 100% offline, private, and free."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "local-llm", "file-organizer", "ollama", "automation", "cli", "devchallenge"]
authors = [
    { name = "SlothSort Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities"
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
slothsort = "slothsort.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["slothsort"]
