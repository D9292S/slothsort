<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="180" fill="#10b981" opacity="0.12" filter="url(#blurGlow)" />
  <circle cx="1000" cy="450" r="220" fill="#06b6d4" opacity="0.14" filter="url(#blurGlow)" />
  <circle cx="950" cy="150" r="150" fill="#8b5cf6" opacity="0.1" filter="url(#blurGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.5">HACKTOBERFEST 2026 • WEEK 3</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">
      SlothSort <tspan fill="url(#cyanGreen)">🦥</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
      Offline AI file organizer that rewards laziness.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 240)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">⚡ 100% Offline</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="198" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#34d399">🔒 Zero Cloud Leak</text>

      <!-- Tag 3 -->
      <rect x="365" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="383" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#fbbf24">🤖 Ollama + Llama</text>
    </g>

    <!-- Terminal Command snippet -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="460" height="50" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="20" cy="25" r="5" fill="#ef4444" />
      <circle cx="36" cy="25" r="5" fill="#f59e0b" />
      <circle cx="52" cy="25" r="5" fill="#10b981" />
      <text x="75" y="31" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#64748b">$ <tspan fill="#f1f5f9">slothsort ~/Downloads --watch --dedupe</tspan></text>
    </g>
  </g>

  <!-- Right Visual Graphics: Tree & Floating Folders Card -->
  <g transform="translate(740, 110)">
    <!-- Terminal Preview Card -->
    <rect x="0" y="0" width="380" height="410" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95" />
    <rect x="0" y="0" width="380" height="44" rx="20" fill="#1e293b" />
    <rect x="0" y="24" width="380" height="20" fill="#1e293b" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="140" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">~/Downloads</text>

    <!-- Visual Sorted Branches -->
    <g transform="translate(30, 75)" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
      <!-- Folder 1 -->
      <text x="0" y="20" fill="#38bdf8" font-weight="700">📁 Documents/</text>
      <text x="25" y="45" fill="#94a3b8">├── budget-q4.xlsx</text>
      <text x="25" y="70" fill="#34d399">└── final-report.docx</text>

      <!-- Folder 2 -->
      <text x="0" y="115" fill="#fbbf24" font-weight="700">📁 Images/</text>
      <text x="25" y="140" fill="#94a3b8">├── photo-2024-10.jpg</text>
      <text x="25" y="165" fill="#34d399">└── screenshot-bug.png</text>

      <!-- Folder 3 -->
      <text x="0" y="210" fill="#a855f7" font-weight="700">📁 Duplicates/</text>
      <text x="25" y="235" fill="#f43f5e">└── invoice (1).pdf [deduped]</text>

      <!-- Folder 4 -->
      <text x="0" y="280" fill="#10b981" font-weight="700">📁 Installers/</text>
      <text x="25" y="305" fill="#94a3b8">└── vscode-setup.exe</text>
    </g>

    <!-- Floating Pill Badge on Card -->
    <g transform="translate(190, 360)">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#10b981" opacity="0.2" />
      <rect x="0" y="0" width="165" height="34" rx="17" fill="none" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981">✓ 31 files organized</text>
    </g>
  </g>
</svg>
